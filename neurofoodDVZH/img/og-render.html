<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0B0E11;
    font-family: Inter, system-ui, sans-serif;
}

.wrap {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
}

/* ── Two halves ── */
.half {
    position: absolute;
    top: 0;
    width: 600px;
    height: 630px;
    overflow: hidden;
}
.half--left  { left: 0; }
.half--right { left: 600px; }

.half img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.half--left img {
    filter: grayscale(100%) brightness(0.8);
}
.half--right img {
    filter: brightness(1.05) saturate(1.15);
}

.half--left::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(11,14,17,0.4);
}
.half--right::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(11,14,17,0.18);
}

/* ── Gradients for text readability ── */
.grad-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 220px;
    background: linear-gradient(to bottom, rgba(11,14,17,0.92) 0%, rgba(11,14,17,0) 100%);
    z-index: 10;
}
.grad-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 170px;
    background: linear-gradient(to top, rgba(11,14,17,0.92) 0%, rgba(11,14,17,0) 100%);
    z-index: 10;
}

/* ── Center divider ── */
.divider {
    position: absolute;
    left: 599px;
    top: 0; bottom: 0;
    width: 2px;
    background: rgba(47,185,179,0.75);
    z-index: 20;
}
.divider::before {
    content: '';
    position: absolute;
    left: -10px;
    top: 0; bottom: 0;
    width: 22px;
    background: rgba(47,185,179,0.07);
}

/* ── Handle ── */
.handle {
    position: absolute;
    left: 600px;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #0B0E11;
    border: 1.5px solid rgba(47,185,179,0.85);
    z-index: 21;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
}
.arrow {
    width: 0; height: 0;
    flex-shrink: 0;
}
.arrow--left {
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-right: 9px solid #2FB9B3;
}
.arrow--right {
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 9px solid #2FB9B3;
}

/* ── Before / After labels ── */
.lbl {
    position: absolute;
    top: 28px;
    z-index: 30;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.lbl--before {
    left: 28px;
    background: rgba(11,14,17,0.65);
    border: 1px solid rgba(230,232,235,0.22);
    color: rgba(230,232,235,0.5);
}
.lbl--after {
    right: 28px;
    background: rgba(47,185,179,0.12);
    border: 1px solid rgba(47,185,179,0.45);
    color: #2FB9B3;
}

/* ── Brand text ── */
.brand {
    position: absolute;
    top: 48px;
    left: 60px;
    z-index: 30;
    color: #fff;
    font-size: 52px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.5px;
}

/* ── Caption ── */
.caption {
    position: absolute;
    bottom: 44px;
    left: 60px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 14px;
    color: rgba(230,232,235,0.72);
    font-size: 24px;
    font-weight: 400;
}
.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #2FB9B3;
    flex-shrink: 0;
}
</style>
</head>
<body>
<div class="wrap">

    <div class="half half--left">
        <img src="hero.png" alt="">
    </div>
    <div class="half half--right">
        <img src="hero.png" alt="">
    </div>

    <div class="grad-top"></div>
    <div class="grad-bottom"></div>

    <div class="divider"></div>
    <div class="handle">
        <span class="arrow arrow--left"></span>
        <span class="arrow arrow--right"></span>
    </div>

    <span class="lbl lbl--before">До</span>
    <span class="lbl lbl--after">После</span>

    <div class="brand">НейроФуд × DVZH</div>

    <div class="caption">
        <span class="dot"></span>
        AI-обработка фото блюд для доставки
    </div>

</div>
</body>
</html>
